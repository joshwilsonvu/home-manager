<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Force IBM Plex as the default for each generic family.
       Using <match>/<edit mode="assign"> ensures this wins over any
       system <alias>/<prefer> rules that run in later conf.d files. -->

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>IBM Plex Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>IBM Plex Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>IBM Plex Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>IBM Plex Serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>IBM Plex Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>mono</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>IBM Plex Mono</string>
    </edit>
  </match>


  <!-- Expose virtual "System *" font families by injecting extra family names
       during font scanning. These appear in fc-list and application font pickers
       (e.g. Zed) as real selectable fonts, resolving to the IBM Plex faces. -->

  <match target="scan">
    <test name="family"><string>IBM Plex Sans</string></test>
    <edit name="family" mode="append_last" binding="strong">
      <string>System Sans</string>
    </edit>
  </match>

  <match target="scan">
    <test name="family"><string>IBM Plex Serif</string></test>
    <edit name="family" mode="append_last" binding="strong">
      <string>System Serif</string>
    </edit>
  </match>

  <match target="scan">
    <test name="family"><string>IBM Plex Mono</string></test>
    <edit name="family" mode="append_last" binding="strong">
      <string>System Mono</string>
    </edit>
  </match>

</fontconfig>
